<!-- =========================================================================
     Template: Instagram Photo / Post Embed Card
     Used by MediaGallery in js/gallery.js
     ========================================================================= -->
<div class="instagram-card instagram-post-card">
    <!-- Added data-field="embed-container" here -->
    <div class="instagram-embed-wrapper instagram-post-wrapper" data-field="embed-container">
    </div>
    <div class="instagram-caption" data-field="caption-container">
        <h3 class="instagram-title" data-field="title"></h3>
        <p class="instagram-description" data-field="description"></p>
    </div>
</div>
