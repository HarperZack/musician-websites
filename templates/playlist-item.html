<!-- =========================================================================
     Template: Audio Playlist Item
     Used by AudioPlayer in js/audio-player.js
     ========================================================================= -->
<li class="playlist-item">
	<div class="playlist-item-meta">
		<span class="playlist-item-num" data-field="num"></span>
		<div>
			<div class="playlist-item-title" data-field="title"></div>
			<div class="playlist-item-genre" data-field="genre"></div>
		</div>
	</div>
	<span class="playlist-item-duration" data-field="duration"></span>
</li>
