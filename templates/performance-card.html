<!-- =========================================================================
     Template: Performance Card
     Used by PerformanceCalendar in js/calendar.js
     ========================================================================= -->
<div class="performance-card">
	<div class="performance-date-badge">
		<span class="date-month" data-field="month"></span>
		<span class="date-day" data-field="day"></span>
		<span class="date-weekday" data-field="weekday"></span>
	</div>
	<div class="performance-details">
		<h3 class="performance-title" data-field="title"></h3>
		<p class="performance-venue">
			<strong data-field="venue"></strong> &bull; <span data-field="location"></span>
		</p>
		<p class="performance-time" data-field="time"></p>
	</div>
	<div class="performance-action">
		<a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-primary" data-field="ticket-btn" style="display: none;">Tickets / Info</a>
		<span class="badge-free" data-field="free-badge" style="display: none;">Free / Public</span>
	</div>
</div>
