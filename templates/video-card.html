<!-- =========================================================================
     Template: Video Card
     Used by MediaGallery in js/gallery.js
     ========================================================================= -->
<div class="video-card">
	<div class="video-responsive-wrapper">
		<iframe
			src=""
			title=""
			frameborder="0"
			allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
			allowfullscreen
			loading="lazy"
			data-field="iframe">
		</iframe>
	</div>
	<div class="video-caption">
		<h3 class="video-title" data-field="title"></h3>
		<p class="video-description" data-field="description"></p>
	</div>
</div>
